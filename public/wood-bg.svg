<svg xmlns="http://www.w3.org/2000/svg" width="100" height="800" viewBox="0 0 100 800">
  <defs>
    <linearGradient id="woodGrain" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5A3C;stop-opacity:1" />
      <stop offset="25%" style="stop-color:#A0694D;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8B5A3C;stop-opacity:1" />
      <stop offset="75%" style="stop-color:#9E6B4E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5A3C;stop-opacity:1" />
    </linearGradient>
    <pattern id="grain" patternUnits="userSpaceOnUse" width="100" height="4">
      <rect width="100" height="4" fill="url(#woodGrain)"/>
      <line x1="0" y1="2" x2="100" y2="2" stroke="#7A4E35" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="100" height="800" fill="url(#grain)"/>
  <!-- Vertical grain lines -->
  <line x1="10" y1="0" x2="10" y2="800" stroke="#6B4423" stroke-width="1" opacity="0.2"/>
  <line x1="30" y1="0" x2="30" y2="800" stroke="#6B4423" stroke-width="0.5" opacity="0.15"/>
  <line x1="50" y1="0" x2="50" y2="800" stroke="#6B4423" stroke-width="1" opacity="0.2"/>
  <line x1="70" y1="0" x2="70" y2="800" stroke="#6B4423" stroke-width="0.5" opacity="0.15"/>
  <line x1="90" y1="0" x2="90" y2="800" stroke="#6B4423" stroke-width="1" opacity="0.2"/>
  <!-- Knots and variations -->
  <ellipse cx="25" cy="150" rx="8" ry="12" fill="#6B4423" opacity="0.3"/>
  <ellipse cx="75" cy="400" rx="6" ry="10" fill="#6B4423" opacity="0.25"/>
  <ellipse cx="45" cy="650" rx="7" ry="11" fill="#6B4423" opacity="0.3"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500">
  <defs>
    <linearGradient id="stem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2D5016"/>
      <stop offset="50%" style="stop-color:#4A7023"/>
      <stop offset="100%" style="stop-color:#2D5016"/>
    </linearGradient>
    <linearGradient id="whiteRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFEF9"/>
      <stop offset="50%" style="stop-color:#F5F5DC"/>
      <stop offset="100%" style="stop-color:#E8E8D0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#228B22"/>
      <stop offset="50%" style="stop-color:#3CB371"/>
      <stop offset="100%" style="stop-color:#228B22"/>
    </linearGradient>
  </defs>

  <!-- Stems bundle -->
  <g id="stems">
    <path d="M180 500 Q185 400 190 320" stroke="url(#stem)" stroke-width="4" fill="none"/>
    <path d="M190 500 Q195 400 200 300" stroke="url(#stem)" stroke-width="5" fill="none"/>
    <path d="M200 500 Q200 400 200 280" stroke="url(#stem)" stroke-width="5" fill="none"/>
    <path d="M210 500 Q205 400 200 290" stroke="url(#stem)" stroke-width="4" fill="none"/>
    <path d="M220 500 Q215 400 210 310" stroke="url(#stem)" stroke-width="4" fill="none"/>
  </g>

  <!-- Eucalyptus/filler greenery -->
  <g id="greenery">
    <path d="M100 200 Q80 180 60 220 Q80 200 100 200" fill="url(#leaf)" opacity="0.8"/>
    <path d="M90 230 Q60 210 50 250 Q70 230 90 230" fill="url(#leaf)" opacity="0.7"/>
    <path d="M110 170 Q90 140 70 180 Q90 160 110 170" fill="url(#leaf)" opacity="0.8"/>
    <path d="M120 250 Q90 230 80 270 Q100 250 120 250" fill="url(#leaf)" opacity="0.7"/>
    <path d="M300 200 Q320 180 340 220 Q320 200 300 200" fill="url(#leaf)" opacity="0.8"/>
    <path d="M310 230 Q340 210 350 250 Q330 230 310 230" fill="url(#leaf)" opacity="0.7"/>
    <path d="M290 170 Q310 140 330 180 Q310 160 290 170" fill="url(#leaf)" opacity="0.8"/>
    <path d="M280 250 Q310 230 320 270 Q300 250 280 250" fill="url(#leaf)" opacity="0.7"/>
    <path d="M200 80 Q180 50 200 30 Q220 50 200 80" fill="url(#leaf)" opacity="0.6"/>
    <path d="M170 100 Q150 70 160 50 Q175 75 170 100" fill="url(#leaf)" opacity="0.7"/>
    <path d="M230 100 Q250 70 240 50 Q225 75 230 100" fill="url(#leaf)" opacity="0.7"/>
  </g>

  <!-- Baby's breath (slightly pink tinted for contrast) -->
  <g id="babysbreath" fill="#FFE4E1">
    <circle cx="130" cy="140" r="4"/>
    <circle cx="125" cy="150" r="3"/>
    <circle cx="140" cy="135" r="3"/>
    <circle cx="270" cy="140" r="4"/>
    <circle cx="275" cy="150" r="3"/>
    <circle cx="260" cy="135" r="3"/>
    <circle cx="160" cy="100" r="3"/>
    <circle cx="240" cy="100" r="3"/>
    <circle cx="200" cy="90" r="4"/>
  </g>

  <!-- White/Cream Roses -->
  <g id="roses">
    <circle cx="200" cy="150" r="35" fill="url(#whiteRose)" stroke="#D4D4AA" stroke-width="1"/>
    <path d="M185 145 Q200 130 215 145 Q200 160 185 145" fill="#E8E8D0" opacity="0.8"/>
    <path d="M190 155 Q200 145 210 155 Q200 165 190 155" fill="#D4D4AA" opacity="0.6"/>
    <ellipse cx="200" cy="150" rx="8" ry="10" fill="#FFFEF9" opacity="0.8"/>

    <circle cx="150" cy="130" r="30" fill="url(#whiteRose)" stroke="#D4D4AA" stroke-width="1"/>
    <path d="M137 125 Q150 112 163 125 Q150 138 137 125" fill="#E8E8D0" opacity="0.8"/>
    <ellipse cx="150" cy="130" rx="6" ry="8" fill="#FFFEF9" opacity="0.8"/>

    <circle cx="250" cy="130" r="30" fill="url(#whiteRose)" stroke="#D4D4AA" stroke-width="1"/>
    <path d="M237 125 Q250 112 263 125 Q250 138 237 125" fill="#E8E8D0" opacity="0.8"/>
    <ellipse cx="250" cy="130" rx="6" ry="8" fill="#FFFEF9" opacity="0.8"/>

    <circle cx="140" cy="190" r="28" fill="url(#whiteRose)" stroke="#D4D4AA" stroke-width="1"/>
    <path d="M128 185 Q140 173 152 185 Q140 197 128 185" fill="#E8E8D0" opacity="0.8"/>
    <ellipse cx="140" cy="190" rx="5" ry="7" fill="#FFFEF9" opacity="0.8"/>

    <circle cx="260" cy="190" r="28" fill="url(#whiteRose)" stroke="#D4D4AA" stroke-width="1"/>
    <path d="M248 185 Q260 173 272 185 Q260 197 248 185" fill="#E8E8D0" opacity="0.8"/>
    <ellipse cx="260" cy="190" rx="5" ry="7" fill="#FFFEF9" opacity="0.8"/>

    <circle cx="200" cy="220" r="32" fill="url(#whiteRose)" stroke="#D4D4AA" stroke-width="1"/>
    <path d="M186 215 Q200 202 214 215 Q200 228 186 215" fill="#E8E8D0" opacity="0.8"/>
    <ellipse cx="200" cy="220" rx="7" ry="9" fill="#FFFEF9" opacity="0.8"/>

    <circle cx="170" cy="160" r="20" fill="url(#whiteRose)" stroke="#D4D4AA" stroke-width="1"/>
    <circle cx="230" cy="160" r="20" fill="url(#whiteRose)" stroke="#D4D4AA" stroke-width="1"/>
  </g>

  <ellipse cx="200" cy="310" rx="40" ry="15" fill="#8B5A3C" opacity="0.5"/>
</svg>
